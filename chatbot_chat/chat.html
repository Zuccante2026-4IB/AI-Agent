<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="SingleStylesheetFolder/style.css">
    <title>Document</title>
</head>

<body>
    <main id="PaginaChat">
        <nav>
            <a href="index.html">
                <div class="dot"></div>
                <span class="navText">Progetto Get Up</span>
            </a>
            <div class="OtherLinks">
                <a href="events.html">
                    <span class="navText">Events</span>
                </a>
                <a href="credits.html">
                    <span class="navText">Credits</span>
                </a>
                <a href="login.html">
                    <span class="navText login">Login</span>
                </a>
            </div>
        </nav>
        <div class="chatarea">
            <div class="messagerow-ai">
                <img src="background.jpg" alt="AI Avatar">
                <div class="message-ai">
                    Ciao! Come posso aiutarti?
                </div>
            </div>
            <div class="messagerow-user">
                <div class="message-user">
                    Vorrei informazioni sugli eventi.
                </div>
                <img src="background.jpg" alt="User Avatar">
            </div>
        </div>
        <div class="inputarea">
            <input type="text" placeholder="Scrivi qui...">
            <button class="btn-primary"></button>
        </div>
    </main>
    <script src="app.js"></script>
</body>

</html>
